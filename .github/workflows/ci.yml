name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      STELLAR_NETWORK: testnet
      SMTP_HOST: ""
      SKIP_CONTRACT_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install dependencies
        run: npm install

      # Jest only loads modules a test touches and mocks hide syntax errors, so parse every source file.
      - name: Syntax check backend sources
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint backend for duplicate/unreachable code
        run: >-
          npx eslint src --no-eslintrc --parser-options ecmaVersion:latest
          --env node,es2021
          --rule '{"no-dupe-keys":"error","no-redeclare":"error","no-unreachable":"error","no-dupe-class-members":"error"}'

      # Boots the real server (in-memory SQLite) so import-time failures in any module surface here.
      - name: Boot server and poll health
        env:
          PORT: 4000
          SQLITE_PATH: ':memory:'
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          SOROBAN_ESCROW_CONTRACT_ID: ci-placeholder
          SOROBAN_XLM_TOKEN_CONTRACT_ID: ci-placeholder
        run: |
          node src/index.js > "$RUNNER_TEMP/boot.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Server exited during boot"; cat "$RUNNER_TEMP/boot.log"; exit 1
            fi
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/v1/health)" = "200" ]; then
              echo "Health check returned 200"
              kill "$pid"
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not return 200 within 30s"; cat "$RUNNER_TEMP/boot.log"
          kill "$pid"
          exit 1

      - name: Run tests with coverage
        run: npm run test:coverage

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  frontend-bundle-size:
    name: Frontend Bundle Size Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size budgets
        # BUNDLE_INITIAL_BUDGET_KB: max KiB for vendor+index (initial load, uncompressed)
        # BUNDLE_TOTAL_BUDGET_KB:   max KiB for all JS chunks combined (uncompressed)
        # Raise these intentionally and document the reason — never bump silently.
        env:
          BUNDLE_INITIAL_BUDGET_KB: 500
          BUNDLE_TOTAL_BUDGET_KB: 5000
        run: node scripts/check-bundle-size.js

      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-size
          path: frontend/dist/assets/*.js
          retention-days: 30

  smoke-test-testnet:
    name: Escrow Testnet Smoke Test
    # Only on merges to main — this touches live Stellar Testnet, not on every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    env:
      ORDER_ID: ${{ github.run_id }}
      STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'

  soroban-contracts:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Check EscrowError codes (NEXT_CODE, no reuse, README table)
        run: bash scripts/check-escrow-error-codes.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock', 'contracts/Cargo.toml', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Run escrow tests
        run: cargo test -p soroban-escrow --lib

      - name: Run creator-earnings tests
        run: cargo test -p creator-earnings --features testutils

      - name: Profile contracts WASM binary sizes
        run: bash wasm-profile.sh | tee contracts-wasm-profile.txt

      - name: Upload contracts size report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm-size-profile
          path: contracts/contracts-wasm-profile.txt
          retention-days: 30

  contracts:
    name: Contracts (fmt, clippy, test, wasm)
    # Runs on every PR and push to main so non-compiling contract code can't land (#1286).
    # The legacy `contract/` crate is deprecated (see ADR 0002) and is intentionally
    # excluded from this matrix; only the actively developed `contracts/` workspace is built.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SDK =22.0.0 workspace
          - name: contracts-workspace
            dir: contracts
            sdk: sdk22
            wasm: soroban_escrow creator_earnings
