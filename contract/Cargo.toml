[package]
name = "escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

# Pinned to the same exact SDK generation used throughout `contracts/` so the
# two layouts share a single soroban-sdk version — see ADR 0001
# (docs/adr/0001-soroban-contract-boundaries.md).
[dependencies]
soroban-sdk = { version = "=22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
